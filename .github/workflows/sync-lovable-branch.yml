# Sync Lovable branch – mergar main in i feature/lovable efter varje ändring på main.
#
# Varför: Lovable synkar bara mot sin egen branch (feature/lovable). PR:er mergas
# till main med squash, så feature/lovable får aldrig main:s commits av sig själv.
# Utan synk skulle nästa Lovable-PR innehålla redan mergade ändringar och ge konflikter.
#
# - Merge commit, aldrig rebase eller force push (Lovable kräver oförändrad historik).
# - Vid konflikt pushas ingenting; synka då manuellt (se CI.md).
# - Ändringar i .github/workflows kan inte pushas av appen (den saknar avsiktligt
#   behörigheten "Workflows"); sådana synkar görs manuellt.
# - Pushen görs med appens token så att CI och Sensitive change gate körs om på en
#   öppen Lovable-PR. Lovable hämtar merge-commiten automatiskt.
# - Checkar ut feature/lovable enbart för att göra en git-merge. Ingen kod i
#   repot exekveras (inga npm-skript, inga byggsteg).
name: Sync Lovable branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-lovable-branch
  cancel-in-progress: false

env:
  LOVABLE_BRANCH: feature/lovable

jobs:
  sync:
    name: Merge main into feature/lovable
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Check whether a sync is needed
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/branches/$LOVABLE_BRANCH" --silent 2>/dev/null; then
            echo "::notice::$LOVABLE_BRANCH finns inte – inget att synka."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Antal commits på main som saknas i feature/lovable.
          missing=$(gh api "repos/$REPO/compare/$LOVABLE_BRANCH...main" --jq '.ahead_by')
          echo "main ligger $missing commit(s) före $LOVABLE_BRANCH."
          if [[ "$missing" == "0" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout feature/lovable
        if: steps.check.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LOVABLE_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main and push
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch --no-tags origin main
          if ! git merge --no-ff --no-edit -m "Merge main into $LOVABLE_BRANCH" origin/main; then
            git merge --abort || true
            echo "::error title=Konflikt::main kan inte mergas in i $LOVABLE_BRANCH automatiskt. Lös konflikten manuellt (se CI.md)."
            exit 1
          fi

          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            echo "::error title=Manuell synk krävs::main innehåller ändrade workflows. Appen får inte pusha dem – synka $LOVABLE_BRANCH manuellt (se CI.md)."
            exit 1
          fi

          # Ingen force push: misslyckas om Lovable har pushat under tiden. Kör då om jobbet.
          git push origin "HEAD:refs/heads/$LOVABLE_BRANCH"
          echo "main mergad in i $LOVABLE_BRANCH."
